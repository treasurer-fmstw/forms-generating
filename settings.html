<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>字型設定 · FMSTW</title><link rel="stylesheet" href="assets/forms.css"><link rel="stylesheet" href="assets/app.css"></head><body><header class="site-header"><a href="index.html" class="wordmark">FMSTW <span>字型設定</span></a></header><main class="admin-wrap"><h1>固定單據字型</h1><p>這版可先從裝置選擇可使用的 TTF 字型，僅存於這台瀏覽器，不上傳 GitHub 或雲端。部署時也可由管理者在 config.js 指定已授權的字型網址。</p><p>中文選標楷體；英文與數字選 Times New Roman。尚不支援以 TTC 集合檔直接匯入。</p><section><label for="kai">中文標楷體（TTF）</label><input type="file" id="kai" accept=".ttf"><p id="kaiStatus"></p><label for="times">Times New Roman（TTF）</label><input type="file" id="times" accept=".ttf"><p id="timesStatus"></p><button id="clearFonts">清除此裝置字型</button></section><p id="status" role="status"></p><a href="index.html">返回填單</a></main><script src="assets/storage.js"></script><script src="assets/settings.js"></script></body></html>
